spring:
  application:
    name: daycare
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/daycare}
    username: ${DB_USERNAME:daycare}
    password: ${DB_PASSWORD:daycare}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

jwt:
  issuer: daycare-api
  # TTL = Time To Live = durée de vie du token avant expiration
  access-token-ttl-seconds: 900     # 15 minutes
  refresh-token-ttl-seconds: 604800 # 7 jours (7 * 24h)
  rsa:
    public-key: classpath:certs/public.pem
    private-key: classpath:certs/private.pem
