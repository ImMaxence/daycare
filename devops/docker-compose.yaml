services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: daycare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daycare_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: 
      context: ./back
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/daycare_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=rootpassword
    restart: unless-stopped

  frontend:
    build: 
      context: ./front
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data: